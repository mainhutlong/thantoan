<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Hệ thống Thanh toán Giờ giảng TDU - Đại học Tây Đô</title>
    <meta name="description" content="Hệ thống quản lý và thanh toán giờ giảng dạy giảng viên Trường Đại học Tây Đô (TDU)." />
    <meta property="og:title" content="Hệ thống Thanh toán Giờ giảng TDU - Đại học Tây Đô" />
    <meta property="og:description" content="Hệ thống quản lý và thanh toán giờ giảng dạy giảng viên Trường Đại học Tây Đô (TDU)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Identity Services for TDU SSO Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tdu_zoom');
          var isMobile = window.innerWidth < 768;
          var z = (saved && saved !== '1.0' && saved !== '1') ? saved : (isMobile ? '1.0' : '1.25');
          document.documentElement.style.zoom = z;
          document.documentElement.style.setProperty('--app-zoom', z);
          document.documentElement.style.setProperty('--modal-zoom', String(1 / Number(z)));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
